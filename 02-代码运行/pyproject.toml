[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-campaign-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.5",
  "curl_cffi==0.13.0",
  "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
