name: Airline campaign monitor

on:
  schedule:
    # China Standard Time: 01:20, 09:20, 17:20
    - cron: "20 17,1,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: airline-campaign-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Monitor official campaigns
        run: python -m airline_campaign_monitor.monitor

      - name: Commit data only when changed
        run: |
          git add data/ csv/
          if git diff --cached --quiet; then
            echo "Campaign state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update airline campaign state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deliver pending notifications
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m airline_campaign_monitor.notifications
      - name: Persist delivery acknowledgements
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ csv/
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve pending notifications and delivery state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refresh local monitor health
        if: ${{ always() && !cancelled() && inputs.dry_run != true && inputs.live_check != true }}
        env:
          MONITOR_JOB_STATUS: ${{ job.status }}
        run: python scripts/write_health.py
      - name: Preserve monitor reports and recovery state
        if: ${{ always() && !cancelled() && inputs.dry_run != true && inputs.live_check != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ csv/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "data: update monitor health and preserve recovery state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
