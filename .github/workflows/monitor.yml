name: Airline campaign monitor

on:
  schedule:
    # China Standard Time: 01:20, 09:20, 17:20
    - cron: "20 17,1,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: airline-campaign-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Monitor official campaigns
        run: python -m airline_campaign_monitor.monitor

      - name: Commit data only when changed
        run: |
          git add data/campaigns.json data/csv/
          if git diff --cached --quiet; then
            echo "Campaign state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update airline campaign state"
          git push

      - name: Create notification issue
        if: ${{ hashFiles('runtime/change.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: |
          gh label create alert --description "Automated monitoring alert" --color D73A4A --force
          gh issue create \
            --title "[ALERT] 航司促销活动更新 - $(date +%F)" \
            --body-file runtime/change.md \
            --assignee ruoxueqaq-gif \
            --label alert
