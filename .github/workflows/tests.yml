name: Test airline monitor

on:
  push:
    branches: [main]
    paths:
      - "02-代码运行/config*.yaml"
      - "02-代码运行/scripts/**"
      - ".github/workflows/monitor.yml"
      - "02-代码运行/src/**"
      - "02-代码运行/tests/**"
      - "02-代码运行/pyproject.toml"
      - "02-代码运行/requirements*.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "02-代码运行/config*.yaml"
      - "02-代码运行/scripts/**"
      - ".github/workflows/monitor.yml"
      - "02-代码运行/src/**"
      - "02-代码运行/tests/**"
      - "02-代码运行/pyproject.toml"
      - "02-代码运行/requirements*.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 02-代码运行

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-代码运行/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
